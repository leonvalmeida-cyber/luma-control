name: Luma Flow V4.9 checks
on:
  push:
    paths: ['flow-v49/**', '.github/workflows/flow-v49-tests.yml']
  pull_request:
    paths: ['flow-v49/**', '.github/workflows/flow-v49-tests.yml']
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test flow-v49/tests/v49.test.cjs
