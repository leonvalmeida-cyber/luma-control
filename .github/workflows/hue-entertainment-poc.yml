name: Luma Hue Entertainment PoC offline tests
on:
  push:
    paths:
      - 'experiments/hue-entertainment-poc/**'
      - '.github/workflows/hue-entertainment-poc.yml'
  pull_request:
    paths:
      - 'experiments/hue-entertainment-poc/**'
      - '.github/workflows/hue-entertainment-poc.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Parse Python source
        run: python -m py_compile experiments/hue-entertainment-poc/stream_probe.py
      - name: Offline tests (never touches a Hue bridge)
        run: python -m unittest discover -s experiments/hue-entertainment-poc -p 'test_*.py' -v
