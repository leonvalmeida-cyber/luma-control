name: iOS microphone build
on:
  push:
    branches: [dev/ios-mikrofontest]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build iPhone simulator app
        run: xcodebuild -project ios-mikrofontest/LumaApp.xcodeproj -target LumaApp -configuration Debug -sdk iphonesimulator CODE_SIGNING_ALLOWED=NO build
      - name: Build iPhone device app
        run: xcodebuild -project ios-mikrofontest/LumaApp.xcodeproj -target LumaApp -configuration Debug -sdk iphoneos SYMROOT=/tmp/luma-products CODE_SIGNING_ALLOWED=NO build
      - name: Package unsigned test
        run: |
          mkdir -p /tmp/luma-package/Payload
          cp -R /tmp/luma-products/Debug-iphoneos/LumaApp.app /tmp/luma-package/Payload/
          cd /tmp/luma-package
          zip -qr Luma-Mikrofontest.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: Luma-Mikrofontest-unsigniert
          path: /tmp/luma-package/Luma-Mikrofontest.ipa
