name: Luma Flow ambient and conversation guard
on:
  push:
    branches: [feature/luma-flow-v1]
  pull_request:
    paths:
      - 'flow/**'
      - 'tests/flow-noise-guard.test.cjs'
      - 'tests/lamp-icons.test.cjs'
      - 'tests/visual-mood-tree.test.cjs'
      - 'tests/floating-quick-control.test.cjs'
      - 'tests/ambient-lamp-swipe.test.cjs'
      - 'tests/ambient-swipe-v7.test.cjs'
      - 'tests/mood-lamp-swipe-v9.test.cjs'
      - 'ambient-lamp.js'
      - 'quick-swipe.js'
      - 'quick-pull.js'
      - 'tests/quick-pull-v10.test.cjs'
      - 'tests/quick-pull-v3.test.cjs'
      - 'tests/browser-webkit-smoke.cjs'
      - 'quick-overlay.css'
      - 'media/**'
      - 'music-immersive-v1.css'
      - 'groups-v1-tree.css'
      - 'lamp-icons.js'
      - 'lamp-icons.css'
      - 'groups-v1-tree.js'
      - '.github/workflows/flow-noise-guard.yml'
jobs:
  dsp-verification:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and signal-processing regressions
        run: |
          node --check flow/noise-guard.js
          node --test tests/flow-noise-guard.test.cjs tests/lamp-icons.test.cjs tests/visual-mood-tree.test.cjs tests/floating-quick-control.test.cjs tests/ambient-lamp-swipe.test.cjs tests/ambient-swipe-v7.test.cjs tests/mood-lamp-swipe-v9.test.cjs tests/quick-pull-v10.test.cjs tests/quick-pull-v3.test.cjs

  mobile-webkit-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Set up real mobile WebKit
        run: |
          npm install --no-save playwright@1.57.0
          npx playwright install --with-deps webkit
      - name: Verify visible Mood art plus 25/50/75% actual WebKit pull-to-open mechanics
        run: node tests/browser-webkit-smoke.cjs
      - name: Attach visual screenshot for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: luma-mobile-webkit-preview
          path: |
            /tmp/luma-webkit-music.png
            /tmp/luma-webkit-half-pulled.png
            /tmp/luma-webkit-opened.png
            /tmp/luma-webkit-half-closed.png
          if-no-files-found: ignore
