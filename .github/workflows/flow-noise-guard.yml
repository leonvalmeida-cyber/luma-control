name: Luma Flow ambient and conversation guard
on:
  push:
    branches: [feature/luma-flow-v1]
  pull_request:
    paths:
      - 'flow/**'
      - 'tests/flow-noise-guard.test.cjs'
      - 'tests/lamp-icons.test.cjs'
      - 'tests/visual-mood-tree.test.cjs'
      - 'tests/floating-quick-control.test.cjs'
      - 'tests/ambient-lamp-swipe.test.cjs tests/ambient-swipe-v7.test.cjs'
      - 'tests/ambient-swipe-v7.test.cjs'
      - 'ambient-lamp.js'
      - 'quick-swipe.js'
      - 'quick-overlay.css'
      - 'media/**'
      - 'music-immersive-v1.css'
      - 'groups-v1-tree.css'
      - 'lamp-icons.js'
      - 'lamp-icons.css'
      - 'groups-v1-tree.js'
      - '.github/workflows/flow-noise-guard.yml'
jobs:
  dsp-verification:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and signal-processing regressions
        run: |
          node --check flow/noise-guard.js
          node --test tests/flow-noise-guard.test.cjs tests/lamp-icons.test.cjs tests/visual-mood-tree.test.cjs tests/floating-quick-control.test.cjs tests/ambient-lamp-swipe.test.cjs
